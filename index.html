<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24451f"><title>Tavlin | תבלין</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><span class="mark">🌿</span><div><b>Tavlin</b><small>תבלין · המטבח החכם שלך</small></div></div><div class="top"><button id="voice">🎙️ היי מטבח</button><button id="timerBtn">⏱️ <span id="timerBadge">0</span></button><button id="settingsBtn">⚙️</button></div></header><main><section class="hero"><h1>מה מבשלים היום?</h1><div class="search"><input id="search" placeholder="חפש מתכון, מרכיב, מי הביא, גם עם שגיאות…"><button id="searchBtn">חיפוש</button></div><div class="chips" id="chips"><button data-cat="הכל" class="active">הכל</button><button data-cat="חלבי">🥛 חלבי</button><button data-cat="בשרי">🥩 בשרי</button><button data-cat="פרווה">🌿 פרווה</button><button data-cat="ארוחת בוקר">🍳 ארוחת בוקר</button><button data-cat="מרקים">🥣 מרקים</button><button data-cat="קינוחים">🍰 קינוחים</button></div></section><section class="actions"><button class="primary" id="scanBtn">📷 צילום / סריקת מתכון</button><button id="addBtn">＋ מתכון חדש</button><button id="pasteBtn">📝 הדבק טקסט חופשי</button><button id="chatBtn">✨ מה אפשר להכין?</button></section><section class="section"><div class="sectionTitle"><h2>המתכונים שלי</h2><span id="count"></span></div><div id="recipes" class="grid"></div></section></main><aside id="timers" class="panel"><div class="panelHead"><h3>⏱️ מרכז הטיימרים</h3><button data-close="timers">✕</button></div><div id="timerList"></div><button id="manualTimer">＋ טיימר</button></aside><dialog id="editor"><form id="recipeForm"><div class="dlgHead"><h2>מתכון</h2><button type="button" data-close-dialog>✕</button></div><input type="hidden" id="rid"><label>שם המתכון<input id="name" required></label><div class="two"><label>סוג<select id="category"><option>חלבי</option><option>בשרי</option><option>פרווה</option></select></label><label>קטגוריה<input id="subcat" placeholder="קינוחים, מרק…"></label></div><div class="two"><label>של מי המתכון?<input id="author"></label><label>מספר מנות<input id="servings" type="number" min="1" value="4"></label></div><label>תמונות<input id="photo" type="file" accept="image/*" multiple></label><label>מרכיבים<textarea id="ingredients" rows="7" required placeholder="שורה לכל מרכיב"></textarea></label><label>אופן הכנה<textarea id="steps" rows="8" required></textarea></label><button class="primary" type="submit">שמירה</button></form></dialog><dialog id="scanner"><div class="dlgHead"><h2>📷 סריקת כתב יד</h2><button data-close-dialog>✕</button></div><p>אפשר לבחור כמה עמודים. התמונה המקורית נשמרת בנפרד והטקסט תמיד עובר אישור לפני שמירה.</p><input id="scanFile" type="file" accept="image/*" capture="environment" multiple><button class="primary" id="scanStart">התחל פענוח</button><div id="scanStatus"></div></dialog><dialog id="pasteDialog"><div class="dlgHead"><h2>📝 טקסט חופשי</h2><button data-close-dialog>✕</button></div><textarea id="freeText" rows="16" placeholder="הדבק כאן מתכון שלם…"></textarea><button class="primary" id="parseText">סדר לי את המתכון</button></dialog><dialog id="viewer"><div id="viewContent"></div></dialog><dialog id="chat"><div class="dlgHead"><h2>✨ עוזר המטבח</h2><button data-close-dialog>✕</button></div><div id="chatLog" class="chatlog"><p>כתוב למשל: יש לי עוף, תפוחי אדמה ובצל. מה אפשר להכין מהמתכונים שלי?</p></div><div class="chatbox"><input id="chatInput" placeholder="מה יש לך בבית?"><button id="chatSend">שלח</button></div></dialog><dialog id="settings"><div class="dlgHead"><h2>⚙️ הגדרות</h2><button data-close-dialog>✕</button></div><label class="toggle"><input type="checkbox" id="keepAwake" checked> השארת המסך פעיל במצב בישול</label><label class="toggle"><input type="checkbox" id="voiceWake" checked> פקודות קוליות “היי מטבח”</label><label class="toggle"><input type="checkbox" id="ingredientTracking" checked> סימון מה שמתי ומתי</label><label class="toggle"><input type="checkbox" id="personalLearning" checked> למידה אישית</label><label class="toggle"><input type="checkbox" id="shoppingEnabled" checked> רשימת קניות</label><label class="toggle"><input type="checkbox" id="pantryEnabled" checked> מלאי ביתי</label><label>ערכת נושא<select id="theme"><option value="warm">מטבח חם</option><option value="modern">מודרני</option><option value="dark">כהה</option></select></label><button id="exportBtn">⬇️ הורד גיבוי מלא</button><label class="import">⬆️ טען גיבוי<input id="importFile" type="file" accept="application/json"></label></dialog><script src="app.js"></script></body></html>
